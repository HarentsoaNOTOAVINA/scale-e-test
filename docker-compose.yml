version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scale_cdp_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: scal_e_cdp
      DB_USER: root
      DB_PASS: root_password
      API_KEY: scal-e-secret-key-2026
    depends_on:
      - db

  web:
    image: nginx:1.24-alpine
    container_name: scale_cdp_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: scale_cdp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: scal_e_cdp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: scale_cdp_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
